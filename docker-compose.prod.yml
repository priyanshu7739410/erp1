services:
  db:
    image: postgres:15-alpine
    container_name: erp_postgres_prod
    restart: always
    env_file:
      - .env
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d hospital_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: erp_api_prod
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             python seed_sample_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

volumes:
  pgdata_prod:
