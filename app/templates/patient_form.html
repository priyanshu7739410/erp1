{% extends "base.html" %}

{% block title %}Register New Patient{% endblock %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <h1 style="margin-bottom: 0.5rem; color: var(--accent);">Register New Patient</h1>
    <p style="color: var(--text-secondary); margin-bottom: 2rem;">Enter complete clinical demographics and insurance information</p>

    <form action="/patients/new" method="post">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1.25rem;">
            <div class="form-group">
                <label for="name" class="form-label">Full Legal Name *</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@example.com">
            </div>
            <div class="form-group">
                <label for="age" class="form-label">Age *</label>
                <input type="number" id="age" name="age" class="form-control" required min="0" max="150" placeholder="35">
            </div>
            <div class="form-group">
                <label for="gender" class="form-label">Gender *</label>
                <select id="gender" name="gender" class="form-control" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="phone" class="form-label">Phone Number *</label>
                <input type="text" id="phone" name="phone" class="form-control" required placeholder="+1 (555) 019-2834">
            </div>
            <div class="form-group">
                <label for="emergency_contact" class="form-label">Emergency Contact Name & Phone</label>
                <input type="text" id="emergency_contact" name="emergency_contact" class="form-control" placeholder="Jane Doe - +1 (555) 019-2835">
            </div>
        </div>

        <div class="form-group" style="margin-top: 1.25rem;">
            <label for="address" class="form-label">Physical Residential Address</label>
            <input type="text" id="address" name="address" class="form-control" placeholder="123 Health Ave, Suite 4B, Metro City">
        </div>

        <div class="form-group" style="margin-top: 1.25rem;">
            <label for="insurance_provider" class="form-label">Insurance Provider Company</label>
            <input type="text" id="insurance_provider" name="insurance_provider" class="form-control" placeholder="Blue Cross / Aetna / Medicare">
        </div>

        <div class="form-group" style="margin-top: 1.25rem;">
            <label for="medical_history_summary" class="form-label">Prior Medical History Summary & Allergies</label>
            <textarea id="medical_history_summary" name="medical_history_summary" class="form-control" rows="4" placeholder="Penicillin allergy, Type 2 diabetes diagnosed 2020..."></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
            <a href="/patients" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2rem;">Save Patient Record</button>
        </div>
    </form>
</div>
{% endblock %}
