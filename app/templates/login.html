{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card auth-card">
    <h1 style="text-align: center; margin-bottom: 0.5rem; color: var(--accent);">Welcome Back</h1>
    <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Sign in to your account</p>

    <form action="/login" method="post">
        <div class="form-group">
            <label for="username" class="form-label">Username</label>
            <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">Login to ERP</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
        <p style="color: var(--text-secondary);">Don't have an account? <a href="/register" style="color: var(--accent); text-decoration: none; font-weight: 600;">Register here</a></p>
    </div>
</div>
{% endblock %}
